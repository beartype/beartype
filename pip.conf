# --------------------( SYNOPSIS                           )--------------------
# Project-wide pip configuration, applied to all invocations of the pip package
# manager within this project.
#
# --------------------( USAGE                              )--------------------
# Insanely, pip silently ignores this top-level configuration file unless
# specified by exporting the "${PIP_CONFIG_FILE}" environment variable to the
# absolute filename of this file when running pip: e.g.,
#     # Install the CPU-specific PyTorch build under Python 3.15.
#     PIP_CONFIG_FILE="${HOME}/py/beartype/pip.conf" python3.15 -m pip install --upgrade torch

# ....................{ PIP                                }....................
[global]

# Fetch CPU- rather than GPU-specific PyTorch builds. By default, "pip install
# torch" installs Nvidia GPU-specific CUDA PyTorch builds. While understandable,
# that's thoroughly unusable for our use case.
extra-index-url=https://download.pytorch.org/whl/cpu
