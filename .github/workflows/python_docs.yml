#
# --------------------( SYNOPSIS                           )--------------------
# GitHub-specific workflow that builds the documentation for this project with
# Zensical and publishes it with mike. mike stores each version of the
# documentation in its own folder of the "gh-pages" branch. GitHub Pages then
# serves that branch.
#
# This workflow publishes:
# * The "dev" version, when a commit is pushed to the "main" branch.
# * The "X.Y" version, when a release tag "vX.Y.Z" is pushed. The "latest"
#   alias then points to that version. Release candidate tags are ignored.
# * The version given, when this workflow is run by hand.
#
# GitHub Pages must serve the "gh-pages" branch. To set this, go to
# Settings > Pages > Source and select "Deploy from a branch" and "gh-pages".
#
# --------------------( SEE ALSO                           )--------------------
# * https://zensical.org/docs/publish-your-site/
# * https://zensical.org/docs/compatibility/mkdocs/mike/

# ....................{ METADATA                           }....................
# Non-human-readable (i.e., machine-readable) label associated with this
# GitHub Actions workflow.
name: docs

# ....................{ TRIGGER                            }....................
# Confine deployment to only...
on:
  # Pushes to the main branch. Pushes to other branches are assumed to be
  # developer-specific and thus already deployed locally by that developer.
  push:
    branches:
      - 'main'

    # Pushes of release tags (e.g., "v0.23.0").
    tags:
      - 'v*'

  # Manual runs from the "Actions" tab, deploying the passed version.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., "0.23", "dev").'
        required: true
        type: string
      alias:
        description: 'Optional alias to point at this version (e.g., "latest").'
        required: false
        default: ''
        type: string
      set_default:
        description: 'Redirect the site root to this alias (or version).'
        required: false
        default: false
        type: boolean

# Allow only one concurrent run of this workflow while:
# * Skipping runs accidentally queued between the current in-progress run and
#   the most recently queued run.
# * Avoiding cancelling the current in-progress run.
concurrency:
  group: 'pages'
  cancel-in-progress: false

# ....................{ PERMISSIONS                        }....................
# Default job security model applied by default to all jobs performed below.
permissions:
  # Permit third-party GitHub Actions to read the contents of this repository's
  # ".git/" subdirectory (e.g., to list all git commits). This is the safest
  # explicit permission that a GitHub workflow can currently grant to
  # third-party GitHub Actions. Ideally, this permission would be the default.
  # According to the CodeQL code scanner, however, this is *NOT* the case.
  # CodeQL security alerts document that:
  #     If a GitHub Actions job or workflow has no explicit permissions set,
  #     then the repository permissions are used. Repositories created under
  #     organizations inherit the organization permissions. The organizations or
  #     repositories created before February 2023 have the default permissions
  #     set to read-write. Often these permissions do not adhere to the
  #     principle of least privilege and can be reduced to read-only, leaving
  #     the write permission only to a specific types as issues: write or
  #     pull-requests: write.
  #
  # Explicitly granting this permission elides both this CodeQL security alert
  # and the underlying insecurity described by this alert.
  #
  # Note that this permission is "write" rather than "read", so that mike can
  # push the "gh-pages" branch.
  contents: write

# ....................{ MAIN                               }....................
jobs:
  # ...................{ BUILD                              }...................
  # Job generating a new Zensical-driven static site.
  build:
    name: "Create static site with Zensical"
    runs-on: ubuntu-latest

    steps:
      # ..................{ SETUP                            }..................
      - name: "Checking out repository..."
        uses: 'actions/checkout@v7'
      - name: "Installing Python..."
        uses: 'actions/setup-python@v7'
        with:
          python-version: '3.x'
      - name: 'Installing uv...'
        uses: 'astral-sh/setup-uv@v7'
        with:
          # Temporarily cache third-party packages subsequently installed by
          # "uv pip" below. This action intelligently defines the cache key to
          # be hashed against the top-level "pyproject.toml" file and thus
          # silently clears this cache on each change to that file. See also:
          #     https://github.com/actions/setup-python?tab=readme-ov-file#caching-packages-dependencies
          enable-cache: true
          cache-dependency-glob: 'pyproject.toml'
      - name: 'Displaying Python metadata...'
        run: |
          python3 -VV
          python3 -m site

          # Print either:
          # * For free-threading Python builds:
          #       Py_GIL_DISABLED: 1
          # * For GIL-encumbered Python builds:
          #       Py_GIL_DISABLED: 0
          python3 -c "import sysconfig; print('Py_GIL_DISABLED:', sysconfig.get_config_var('Py_GIL_DISABLED'))"

      # ..................{ VALIDATE                         }..................
      #FIXME: Consider uncommenting if we ever run into serious snags with
      #Zensical-specific configuration files or Markdown. Note that we'll also
      #need to additionally define a "yamllint" configuration. See the
      #quasi-authoritative blog article linked above. *sigh*
      # - name: Install yamllint
      #   run: pip install yamllint
      # - name: Check Zensical TOML configuration
      #   run: yamllint ./zensical.toml
      #   continue-on-error: true
      # - name: Check Markdown files
      #   uses: DavidAnson/markdownlint-cli2-action@v19
      #   with:
      #     globs: '**/*.md'
      #   continue-on-error: true

      # ..................{ CACHE                            }..................
      #FIXME: The quasi-authoritative blog article linked above advises *NOT*
      #doing this, as:
      #    "Removed caching as (Material for) MkDocs version is not pinned and
      #     therefore the site builds are not reproducible."
      #The same logic applies to Zensical.
      # # Define a new "${CACHE_ID}" environment variable whose value is the
      # # current 0-based number of the current week with respect to the entire
      # # year. This number is guaranteed to be in the range [0, 53].
      # - name: "Setting caching environment variables..."
      #   run: |
      #     set -xe
      #     echo "CACHE_ID=$(date --utc '+%V')" >> $GITHUB_ENV
      #
      # # Restore all Zensical assets previously cached for the current week by
      # # the most recent run of this workflow. This cache is tied to the week
      # # and thus automatically expires on the Sunday of each new week.
      # - name: "Restoring cached Zensical assets..."
      #   uses: actions/cache@v4
      #   with:
      #     key: "zensical-${{ env.CACHE_ID }}"
      #     path: ".cache"
      #     restore-keys: |
      #       zensical-

      # ..................{ INSTALL                          }..................
      # Install "pip"-based Python dependencies. Note that:
      # * This command *MUST* be platform-agnostic by running under both:
      #   * POSIX-compliant platforms (e.g., Linux, macOS).
      #   * POSIX-noncompliant platforms (e.g., Windows).
      #   In particular, commands that assume a POSIX-compliant shell (e.g.,
      #   Bash) *MUST* be avoided.
      # * Packaging dependencies (e.g., "pip") are upgraded *BEFORE* all
      #   remaining dependencies (e.g., "tox").
      - name: "Upgrading packager dependencies..."
        run: |
          set -xe
          uv pip install --quiet --system --upgrade pip hatch wheel

      # Install the "docs" dependency group in our "pyproject.toml" file. This
      # group lists all tools needed to build the documentation, including mike.
      - name: "Installing documentation dependencies..."
        run: |
          set -xe
          uv pip install --quiet --system --group docs

      # ..................{ DOCUMENTATION                    }..................
      # Build the site once in strict mode to find broken links and other
      # problems. mike does not build in strict mode. See also:
      #     # Further options for this Zensical subcommand.
      #     zensical build --help
      - name: "Validating static site..."
        env:
          # Notify the "zensical build" subcommand run below that it is running
          # under a GitHub Actions-based continuous integration (CI) workflow by
          # defining the quasi-standard "${CI}" environment variable.
          CI: true
        run: |
          set -xe
          zensical build -f ./zensical.toml --strict

      # Select the version and alias to publish. The rules are at the top of
      # this file.
      - name: "Selecting version to deploy..."
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ALIAS: ${{ inputs.alias }}
          INPUT_SET_DEFAULT: ${{ inputs.set_default }}
        run: |
          set -e
          deploy=true version='' alias='' set_default=false
          if [ "${EVENT_NAME}" = 'workflow_dispatch' ]; then
            version="${INPUT_VERSION}"
            alias="${INPUT_ALIAS}"
            set_default="${INPUT_SET_DEFAULT}"
          elif [ "${REF_TYPE}" = 'tag' ]; then
            if [[ "${REF_NAME}" =~ ^v([0-9]+)\.([0-9]+)\.[0-9]+$ ]]; then
              version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
              alias='latest'
              set_default=true
            else
              echo "Ignoring non-release tag \"${REF_NAME}\"."
              deploy=false
            fi
          else
            version='dev'
          fi
          {
            echo "deploy=${deploy}"
            echo "version=${version}"
            echo "alias=${alias}"
            echo "set_default=${set_default}"
          } >> "${GITHUB_OUTPUT}"
          echo "deploy=${deploy} version=${version} alias=${alias} set_default=${set_default}"

      # Build this version with mike and push it to the "gh-pages" branch. The
      # "--update-aliases" option moves an alias (e.g., "latest") from an older
      # version to this version.
      - name: "Deploying version to gh-pages branch..."
        if: steps.select.outputs.deploy == 'true'
        env:
          CI: true
          VERSION: ${{ steps.select.outputs.version }}
          ALIAS: ${{ steps.select.outputs.alias }}
          SET_DEFAULT: ${{ steps.select.outputs.set_default }}
        run: |
          set -xe
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin gh-pages --depth=1 || true
          mike deploy --push --update-aliases "${VERSION}" ${ALIAS:+"${ALIAS}"}
          if [ "${SET_DEFAULT}" = 'true' ]; then
            mike set-default --push "${ALIAS:-${VERSION}}"
          fi
